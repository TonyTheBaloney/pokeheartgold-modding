[package]
name = "mapeditor"
description = "A porymap-style map editor for the HGSS decomp's gen4map files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "mapeditor-rs"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "x11", "wayland", "accesskit", "clipboard"] }
egui = "0.37"
gen4map-format.workspace = true
gen4map-nitro.workspace = true
gen4map-render.workspace = true
png.workspace = true
serde.workspace = true
serde_json.workspace = true
