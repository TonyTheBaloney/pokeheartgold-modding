# [AI-GENERATED / NOT AFFILIATED WITH PRET] claude-opus-5-5, 2026-10-28
[workspace]
resolver = "2"
members = ["crates/gen4map-format", "crates/gen4map-nitro", "crates/gen4map-render", "crates/mapeditor"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"           # egui 0.37
publish = false

[workspace.dependencies]
gen4map-format = { path = "crates/gen4map-format" }
gen4map-nitro = { path = "crates/gen4map-nitro" }
gen4map-render = { path = "crates/gen4map-render" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
png = "0.18"

[profile.dev]
opt-level = 1            # the terrain rasterizer is too slow unoptimized

[profile.dev.package."*"]
opt-level = 3
